services:

  app:
    image: ghcr.io/YOUR_GITHUB_USERNAME/career-pulse:latest
    restart: unless-stopped
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
